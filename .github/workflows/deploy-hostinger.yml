name: Hostinger — despliegue opcional (desactivado por defecto)
on:
  push:
    branches: [lujoarabe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auto-deploy-webhook:
    if: ${{ vars.HOSTINGER_AUTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Activar desplegado a Hostinger mediante webhook secreto
        env:
          DEPLOY_URL: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL}" ]; then
            echo "Falta configurar el secreto HOSTINGER_DEPLOY_WEBHOOK" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 35 --request POST "${DEPLOY_URL}" >/dev/null
          echo "Webhook enviado; validar resultado en hPanel."
